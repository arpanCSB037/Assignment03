<!DOCTYPE html>
<html>

<head>
    <title>CST Faculty Profile</title>
    <link rel="stylesheet" href="CST_faculty.css">
</head>

<body>

    <h1>CST Faculty Profile</h1>

    <div class="search">
        <input type="text" id="facultyInput" placeholder="Enter faculty name">
        <button id="searchButton">Search</button>
    </div>

    <p id="message"></p>

    <div id="profile">

        <img id="facultyPhoto" src="" alt="Faculty Photo">

        <h2 id="facultyName"></h2>

        <p id="facultyEmail"></p>

        <p>
            <strong>Highest Qualification:</strong>
            <span id="facultyQualification"></span>
        </p>

        <h3>Subjects</h3>
        <ul id="subjects"></ul>

        <h3>Research Areas</h3>
        <ul id="research"></ul>

    </div>

    <script src="CST_faculty.js"></script>

</body>

</html>
